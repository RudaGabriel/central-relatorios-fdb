/* Grade: gráfico e vendedores em cima; tabela e painéis embaixo */
.grade{flex:1;min-height:0;display:grid;gap:12px;padding:12px 20px 16px;grid-template-columns:minmax(0,1fr) 300px 300px;grid-template-rows:232px minmax(0,1fr);grid-template-areas:"hr vend esq" "tab prod esq"}
.dir{display:contents}.esq{grid-area:esq;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.cx-hr{grid-area:hr}.cx-vend{grid-area:vend}.cx-prod{grid-area:prod}.cx-tab{grid-area:tab}
.grade .pn{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px 12px;box-shadow:var(--sombra)}
.esq .cx-tipos{flex:none}.esq .cx-pag{flex:0 1 auto}.esq .cx-cx{flex:0 1 auto}.esq .cx-conv{flex:1 1 80px}
.pn>h3{font-size:14px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--tx);padding-bottom:10px}
.pn>h3 em{font-size:12px;font-weight:400;color:var(--mu)}
.vd-cab{display:none}

<script>
window.PAINEL_CFG={cores:{"Gerencial":"var(--t1)","NFC-e":"var(--t2)","NF-e":"var(--t3)","Recebimento":"var(--t4)"},paleta:["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)","var(--p7)","var(--p8)"],corCaixa:"var(--cxc)",
 // Contagem de vendas por tipo no menu lateral (todas as vendas carregadas, sem os filtros).
 after(){const v=(window.ENG&&ENG.vendas)||[],n={todos:v.length};v.forEach(x=>{n[x.t]=(n[x.t]||0)+1;});document.querySelectorAll("[data-sbq]").forEach(e=>{e.textContent=String(n[e.dataset.sbq]||0);});}};
(function(){
 const h=document.documentElement,salvar=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
 const estreito=()=>innerWidth<=1180;
 function ligar(){
  // Links do menu lateral: relatório clássico e configurações do sistema voltam para este painel.
  const q=location.search,f=(function(){const p=new URLSearchParams(q),i=p.get("i")||"",fi=p.get("f")||"";return /^\d{4}-\d{2}-\d{2}$/.test(i)&&/^\d{4}-\d{2}-\d{2}$/.test(fi)?"/periodo?i="+i+"&f="+fi:"/";})();
  document.querySelectorAll(".sbCl").forEach(a=>a.setAttribute("href",f+(f.indexOf("?")>=0?"&":"?")+"classico=1"));
  document.querySelectorAll(".sbCfg").forEach(a=>a.setAttribute("href","/config?voltar="+encodeURIComponent(location.pathname+location.search)));
  // Menu lateral: no computador recolhe e abre (a escolha fica salva); em telas estreitas abre por cima.
  const tgl=document.getElementById("sbTgl"),fundo=document.getElementById("sbFundo");
  const fechar=()=>h.classList.remove("menuAberto");
  tgl.addEventListener("click",()=>{if(estreito()){h.classList.toggle("menuAberto");return;}
   const rec=getComputedStyle(document.getElementById("sb")).width.replace("px","")<100;const novo=rec?"aberto":"recolhido";h.setAttribute("data-menu",novo);salvar("fdb_admin_menu",novo);});
  fundo.addEventListener("click",fechar);
  document.getElementById("sb").addEventListener("click",e=>{if(estreito()&&e.target.closest(".sbIt")&&!e.target.closest(".sbModo"))fechar();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&h.classList.contains("menuAberto"))fechar();});
  addEventListener("resize",()=>{if(!estreito())fechar();});
  // Modo claro ou escuro (botão do cabeçalho e item do menu lateral).
  const txtModo=()=>{const t=h.getAttribute("data-modo")==="escuro"?"Modo claro":"Modo escuro";document.querySelectorAll(".sbModoTxt").forEach(e=>e.textContent=t);};
  const trocar=()=>{const m=h.getAttribute("data-modo")==="escuro"?"claro":"escuro";h.setAttribute("data-modo",m);salvar("fdb_admin_modo",m);txtModo();};
  document.querySelectorAll("#btnModo,.sbModo").forEach(b=>b.addEventListener("click",trocar));txtModo();
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ligar);else ligar();
})();
</script>
