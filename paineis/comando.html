<!doctype html>
<!-- paineis/comando.html — Central de Relatórios FDB · painel de tela única "Central de comando (escuro e técnico)".
     @version 1.1.0
       1.1.0 - 2026-11-13 - Logo com o favicon da pasta do sistema, nome da loja declarado no título e no cabeçalho e avisos no padrão do relatório clássico, nas cores do tema.
                            configurações do sistema). No celular de até 420 px, o relógio do cabeçalho se esconde.
     Histórico completo das versões: CHANGELOG.md no repositório.
     Montado pelo servidor em /painel/comando/: o marcador COMUM recebe comum.css + base.css, o
     CORPO recebe corpo.html e o MOTOR recebe painel.js + motor.js. -->
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de comando · __NOME_LOJA__</title>
<!--COMUM-->
<style>
:root{--cy:#22d3ee;--am:#fbbf24;--bg:#020a10;--pn:rgba(5,22,33,.86);--cab:#061a26;--tx:#dff9ff;--tx2:#a8e6f2;--mu:#5d9fb0;--ln:rgba(34,211,238,.18);--ln2:rgba(34,211,238,.08);--ac:#22d3ee;--ac2:#a78bfa;--hv:rgba(34,211,238,.07);--sel:rgba(34,211,238,.15);--trk:rgba(34,211,238,.1);--gap:10px;
 --d-bg:#041520;--d-tx:#dff9ff;--d-mu:#5d9fb0;--d-ac:#22d3ee;--d-ln:rgba(34,211,238,.2)}
body{padding:10px 12px;gap:10px;background:radial-gradient(1200px 600px at 50% -10%,rgba(34,211,238,.1),transparent 70%),var(--bg);background-image:radial-gradient(1200px 600px at 50% -10%,rgba(34,211,238,.1),transparent 70%),linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;font-family:"Segoe UI",Inter,system-ui,sans-serif}
.hud{position:relative;background:var(--pn);border:1px solid var(--ln)}
.hud:before,.hud:after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cy);pointer-events:none}
.hud:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.hud:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.top{flex:none;display:flex;align-items:center;gap:12px;min-width:0;padding:8px 12px}
.marca{margin-right:auto;min-width:0;display:flex;align-items:center;gap:10px}.mtx{min-width:0}.logo{width:34px;height:34px;flex:none;border:1px solid var(--ln);background:rgba(34,211,238,.06);display:grid;place-items:center;color:var(--cy);font:800 11px "Segoe UI",sans-serif}.marca b{display:block;font-size:14px;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.marca b em{font-style:normal;color:var(--cy)}
.marca small{display:flex;gap:10px;color:var(--mu);font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.vivo{color:var(--am)}.vivo:before{content:"● ";animation:pisca 1.2s steps(1) infinite}@keyframes pisca{50%{opacity:.15}}
.busca{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--ln);background:rgba(2,10,16,.8);padding:0 10px;width:min(360px,30vw);color:var(--cy)}
.busca input{flex:1;min-width:0;border:0;background:none;outline:0;font:600 13px ui-monospace,Consolas,monospace;color:var(--tx);letter-spacing:.04em}
.busca kbd{font:700 10px ui-monospace,Consolas,monospace;border:1px solid var(--ln);padding:0 5px;color:var(--mu)}
.seg{display:flex;gap:2px;flex:none}.seg button{white-space:nowrap;border:1px solid var(--ln);background:transparent;padding:7px 12px;font:700 11.5px "Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--cy);color:#02222c;border-color:var(--cy);box-shadow:0 0 14px -2px var(--cy)}
[data-perf-ctl]{border-radius:0;background:transparent;border-color:var(--ln);color:var(--tx)}[data-perf-ctl] button{border-radius:0}[data-perf-ctl] button[aria-pressed="true"]{background:rgba(34,211,238,.2)}
.lk{display:flex;gap:6px}.lk a,.lk button{font-family:inherit;cursor:pointer;height:34px;display:grid;place-items:center;padding:0 12px;border:1px solid var(--ln);color:var(--tx2);text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}.lk a:hover,.lk button:hover{border-color:var(--cy);color:var(--cy)}
.kpis{flex:none}
.kp{position:relative;background:var(--pn);border:1px solid var(--ln);padding:8px 12px;border-left:2px solid var(--cy)}
.kp small{color:var(--mu);letter-spacing:.18em}.kp b{color:#ecfeff;text-shadow:0 0 14px rgba(34,211,238,.45)}.kp1 b{color:var(--cy)}
.grade{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.col>.pn,.cx-tab{position:relative;background:var(--pn);border:1px solid var(--ln);padding:10px 10px 8px}
.col>.pn:before,.cx-tab:before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;border-left:2px solid var(--cy);border-top:2px solid var(--cy)}
.col>.pn:after,.cx-tab:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-right:2px solid var(--cy);border-bottom:2px solid var(--cy)}
.pn>h3{color:var(--cy);letter-spacing:.2em}.pn>h3:before{content:"▸";color:var(--cy)}.pn>h3 em{color:var(--mu);letter-spacing:.04em}
.cx-tipos{flex:none}.cx-pag{flex:0 1 auto}.cx-cx{flex:0 1 auto}.cx-conv{flex:1 1 90px}
.cx-vend{flex:1.5 1 0}.cx-hr{flex:0 0 150px}.cx-prod{flex:1 1 0}
.cx-tab{min-height:0}.cx-tab .tabela{border:1px solid var(--ln2)}
#cab>*{letter-spacing:.16em}
.lv{border-bottom-color:var(--ln2)}.lv:nth-child(even){background:rgba(34,211,238,.025)}
.c-total{color:#ecfeff}.lv.sel{box-shadow:inset 2px 0 0 var(--cy)}
.tg{border-radius:0;letter-spacing:.1em}
.c-pag i{border-radius:0}
.br,.vd{border-radius:0}.br.on,.vd.on{box-shadow:inset 2px 0 0 var(--cy)}
.br-b,.vd-b,.pd-b{border-radius:0;height:5px;background:repeating-linear-gradient(90deg,rgba(34,211,238,.12) 0 6px,transparent 6px 8px)}
.br-b i,.vd-b i,.pd-b i{border-radius:0;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);box-shadow:0 0 8px var(--c,var(--ac))}
.hr-s{border-radius:0}.hr-c.pk .hr-s{box-shadow:0 0 0 1px var(--am),0 0 12px -2px var(--am)}
#rod{border-top-color:var(--ln);letter-spacing:.04em}
.varre{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(34,211,238,.06) 50%,transparent);height:40%;animation:varre 6s linear infinite}
@keyframes varre{from{transform:translateY(-100%)}to{transform:translateY(250%)}}
#ov{background:rgba(2,10,16,.78)}#ov .det{border:1px solid var(--cy);border-radius:0;box-shadow:0 0 40px -10px rgba(34,211,238,.5)}#ov .det h2{color:#ecfeff;text-shadow:0 0 16px rgba(34,211,238,.5)}#ov .fechar{border-radius:0}

@media (max-width:1700px){.marca b em{display:none}}
@media (max-width:1500px){[data-perf-ctl] .perfRot{display:none}.busca{width:220px}.seg button{padding:7px 9px}.marca b{letter-spacing:.18em}}
@media (min-width:1600px){.grade{grid-template-columns:300px minmax(0,1fr) 380px}.cx-hr{flex-basis:190px}}
@media (max-width:1180px){.grade{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.cx-tab{grid-row:1/3}.esq{grid-column:2;grid-row:1}.dir{grid-column:2;grid-row:2}.cx-prod,.cx-conv{display:none}.busca{width:200px}#kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kp5,.kp6,.kp7{display:none}}
@media (max-width:980px){.lk .lkTxt{display:none}}
@media (max-width:420px){#relogio{display:none}}
@media (max-width:820px){
 body{padding:8px 8px 0;gap:8px}
 .top{flex-wrap:wrap;gap:8px;padding:8px}.marca{width:100%}.marca b{letter-spacing:.1em;font-size:13px}.top .marca b{letter-spacing:.04em;font-size:11.5px}.top .lk button{letter-spacing:.06em}.marca small{letter-spacing:.08em}.busca{flex:1;width:auto}.seg{order:5;width:100%}.seg button{flex:1;padding:7px 2px}[data-perf-ctl]{display:none}
 .grade{display:flex;flex-direction:column;overflow:auto;gap:8px;padding-bottom:8px}.col{display:contents}
 .col>.pn,.cx-tab{flex:none}.cx-tab{flex:1;min-height:0}.cx-vend,.cx-prod{flex:1;min-height:0}.cx-hr{height:180px}
 .abas{margin:0 -8px;background:#041520;border-top:1px solid var(--ln)}
 .cx-tab>h3 em{display:none}
}
.tst{border:1px solid var(--cy);border-radius:0;box-shadow:0 0 30px -10px rgba(34,211,238,.5)}.tst-x{border-radius:0}.tst b{color:var(--cy)}
</style></head><body>
<header class="top hud">
 <div class="marca"><span class="logo"><img src="/favicon.png" alt="" onerror="this.parentNode.classList.add('semImg');this.remove()"></span><div class="mtx"><b>__NOME_LOJA__ <em>// Comando</em></b><small><span class="vivo">ao vivo</span><span data-hoje class="mn"></span><span class="mn" id="relogio"></span></small></div></div>
 <label class="busca">&gt;<input id="q" placeholder="BUSCAR VENDEDOR, ITEM, NÚMERO, VALOR" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
 <div class="seg"><button type="button" class="on" data-tipo="todos">Todos</button><button type="button" data-tipo="Gerencial">Ger</button><button type="button" data-tipo="NFC-e">NFC-e</button><button type="button" data-tipo="NF-e">NF-e</button></div>
 <nav class="lk"><button type="button" id="btnTema" aria-haspopup="menu" aria-expanded="false" title="Escolher o tema (painéis de tela única ou temas clássicos)">Tema<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button><button type="button" id="btnCfg" aria-haspopup="dialog" aria-expanded="false" title="Configurações (desempenho desta tela e do sistema)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lkTxt">Configurações</span></button></nav>
</header>

<script>
window.PAINEL_CFG={cores:{"Gerencial":"#fbbf24","NFC-e":"#22d3ee","NF-e":"#f472b6","Recebimento":"#a78bfa"},paleta:["#22d3ee","#fbbf24","#a78bfa","#f472b6","#34d399","#60a5fa","#fb7185","#a3e635"],corCaixa:"#5d9fb0"};

</body></html>
