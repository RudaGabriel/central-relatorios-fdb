<!doctype html>
<!-- paineis/nitido.html — Central de Relatórios FDB · painel de tela única "Nítido (claro, plano e preciso)".
     @version 1.0.2
       1.0.2 - 2026-11-13 - Desempenho sai do cabeçalho e vai para o botão Configurações (com o relatório clássico e as configurações do sistema).
     Histórico completo das versões: CHANGELOG.md no repositório.
     Montado pelo servidor em /painel/nitido/: o marcador COMUM recebe comum.css + base.css, o
     CORPO recebe corpo.html e o MOTOR recebe painel.js + motor.js. -->
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nítido · Central de Relatórios FDB</title>
<!--COMUM-->
<style>
:root{--bg:#f6f7f9;--pn:#ffffff;--cab:#fafbfc;--tx:#0f172a;--tx2:#334155;--mu:#64748b;--ln:#e5e7eb;--ln2:#f1f3f5;--ac:#2563eb;--ac2:#7c3aed;--hv:#f5f8ff;--sel:#eaf1ff;--trk:#eef0f3;--gap:0px;
 --d-bg:#fff;--d-tx:#0f172a;--d-mu:#64748b;--d-ac:#2563eb;--d-ln:#e5e7eb;--t-bg:#0f172a;--t-tx:#fff;--t-ac:#93c5fd}
body{background:var(--bg)}
.top{flex:none;display:flex;align-items:center;gap:12px;min-width:0;height:52px;padding:0 14px;background:#fff;border-bottom:1px solid var(--ln)}
.marca{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:9.5px;color:#fff;background:#0f172a;flex:none}
.marca b{font-size:14px;white-space:nowrap}.marca small{color:var(--mu);font-size:12px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.sep{width:1px;height:18px;background:var(--ln)}
.vivo{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:#16a34a;font-size:12px}.vivo:before{content:"";width:6px;height:6px;border-radius:50%;background:#16a34a}
.busca{display:flex;align-items:center;gap:8px;height:32px;border-radius:7px;border:1px solid var(--ln);background:#fff;padding:0 10px;width:min(320px,28vw);color:var(--mu)}
.busca:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.busca input{flex:1;min-width:0;border:0;background:none;outline:0;font:500 13px Inter,"Segoe UI",sans-serif;color:var(--tx)}.busca kbd{font:600 10.5px Inter,sans-serif;border:1px solid var(--ln);border-radius:4px;padding:0 5px;color:var(--mu)}
.seg{display:flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--ln);background:none;padding:6px 12px;font-weight:600;font-size:12.5px;color:var(--tx2);cursor:pointer;white-space:nowrap}.seg button:last-child{border-right:0}
.seg button.on{background:#0f172a;color:#fff}
[data-perf-ctl]{background:#fff;border-color:var(--ln);border-radius:7px;color:var(--tx2)}[data-perf-ctl] button{border-radius:5px}[data-perf-ctl] button[aria-pressed="true"]{background:#eef2f7}
.lk{display:flex;gap:6px}.lk a,.lk button{font-family:inherit;cursor:pointer;height:32px;display:grid;place-items:center;padding:0 12px;border-radius:7px;border:1px solid var(--ln);background:#fff;color:var(--tx);text-decoration:none;font-weight:600;font-size:12.5px;white-space:nowrap}.lk a:hover,.lk button:hover{background:#f8fafc}
.kpis{flex:none;background:#fff;border-bottom:1px solid var(--ln)}
.kp{padding:10px 16px 11px;border-right:1px solid var(--ln);position:relative}.kp:last-child{border-right:0}
.kp small{letter-spacing:.04em;text-transform:none;font-size:11.5px;font-weight:600}
.kp b{font-family:Inter,"Segoe UI",sans-serif;font-weight:700;letter-spacing:-.025em;font-size:clamp(16px,1.5vw,22px);font-variant-numeric:tabular-nums}
.kp1:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}.kp1 b{color:var(--tx)}
.grade{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff}
.esq{border-right:1px solid var(--ln)}.dir{border-left:1px solid var(--ln)}
.col>.pn{padding:12px 14px 10px;border-bottom:1px solid var(--ln)}.col>.pn:last-child{border-bottom:0}
.pn>h3{letter-spacing:.02em;text-transform:none;font-size:12.5px;color:var(--tx);font-weight:700}.pn>h3 em{color:var(--mu);font-weight:500;font-size:11.5px}
.cx-tipos{flex:none}.cx-pag{flex:0 1 auto}.cx-cx{flex:0 1 auto}.cx-conv{flex:1 1 90px}
.cx-vend{flex:1.5 1 0}.cx-hr{flex:0 0 150px}.cx-prod{flex:1 1 0}
.cx-tab{min-height:0;background:#fff;padding:12px 0 0}.cx-tab>h3{padding:0 14px 8px}
.cx-tab .tabela{border-top:1px solid var(--ln)}
#cab>*{letter-spacing:.02em;text-transform:none;font-size:11.5px;font-weight:600}
.kp b,.br-t,.vd-t,.pd-t,.c-total,.c-hora,.c-numero,.c-caixa{font-family:Inter,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.mn{font-family:Inter,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0}
.lv{--lh:30px}.lv:hover{background:var(--hv)}
.tg{border-radius:4px}
.c-pag i{border-radius:4px;background:#f8fafc}
.br,.vd{border-radius:5px}.br.on,.vd.on{box-shadow:inset 2px 0 0 var(--c,var(--ac))}
.br-b,.vd-b,.pd-b{height:3px}
.hr-s{border-radius:2px;background:#f3f4f6}
#rod{background:#fafbfc}
#ov{background:rgba(15,23,42,.35)}#ov .det{border-radius:12px;border:1px solid var(--ln);box-shadow:0 30px 60px -20px rgba(15,23,42,.35)}
.toast{border-radius:8px}
@media (max-width:1440px){[data-perf-ctl] .perfRot{display:none}.marca{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:0}.marca .logo{grid-row:1/3}.marca .sep{display:none}.marca small{grid-column:2}}
@media (min-width:1600px){.grade{grid-template-columns:300px minmax(0,1fr) 380px}.cx-hr{flex-basis:190px}}
@media (max-width:1180px){.grade{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.cx-tab{grid-row:1/3;border-right:1px solid var(--ln)}.esq{grid-column:2;grid-row:1;border-right:0;border-bottom:1px solid var(--ln)}.dir{grid-column:2;grid-row:2;border-left:0}.cx-prod,.cx-conv{display:none}.busca{width:200px}#kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kp5,.kp6,.kp7{display:none}}
@media (max-width:980px){.lk .lkTxt{display:none}.sep{display:none}}
@media (max-width:820px){
 .top{height:auto;flex-wrap:wrap;gap:8px;padding:10px}.marca{width:100%}.busca{flex:1;width:auto}.seg{order:5;width:100%}.seg button{flex:1;padding:7px 4px}[data-perf-ctl]{display:none}
 .grade{display:flex;flex-direction:column;overflow:auto}.col{display:contents}
 .col>.pn,.cx-tab{flex:none;background:#fff;border-bottom:1px solid var(--ln)}.cx-tab{flex:1;min-height:0}
 .kpis{border-bottom:1px solid var(--ln)}.kp{border-bottom:1px solid var(--ln)}
 .abas{background:#fff}
 .cx-tab>h3 em{display:none}
}
</style></head><body>
<header class="top">
 <div class="marca"><span class="logo">FDB</span><b>Central de Relatórios FDB</b><span class="sep"></span><small><span class="vivo">Ao vivo</span><span data-hoje></span></small></div>
 <label class="busca">⌕<input id="q" placeholder="Buscar vendedor, item, número, valor…" autocomplete="off"><kbd>/</kbd></label>
 <div class="seg"><button type="button" class="on" data-tipo="todos">Todos</button><button type="button" data-tipo="Gerencial">Gerencial</button><button type="button" data-tipo="NFC-e">NFC-e</button><button type="button" data-tipo="NF-e">NF-e</button></div>
 <nav class="lk"><button type="button" id="btnTema" aria-haspopup="menu" aria-expanded="false" title="Escolher o tema (painéis de tela única ou temas clássicos)">Tema<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button><button type="button" id="btnCfg" aria-haspopup="dialog" aria-expanded="false" title="Configurações (desempenho desta tela e do sistema)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lkTxt">Configurações</span></button></nav>
</header>
<!--CORPO-->
<script>window.PAINEL_CFG={cores:{"Gerencial":"#d97706","NFC-e":"#2563eb","NF-e":"#7c3aed","Recebimento":"#0d9488"},paleta:["#16a34a","#2563eb","#d97706","#db2777","#7c3aed","#0891b2","#dc2626","#65a30d"],corCaixa:"#475569"};</script>

</body></html>
