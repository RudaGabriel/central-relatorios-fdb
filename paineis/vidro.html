<style>
:root{color-scheme:dark;--bg:#0b0d17;--pn:rgba(255,255,255,.055);--cab:rgba(22,25,40,.92);--tx:#f1f3fb;--tx2:#c9cfe2;--mu:#8e96b3;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.05);--ac:#7dd3fc;--ac2:#c4b5fd;--hv:rgba(255,255,255,.05);--sel:rgba(125,211,252,.13);--trk:rgba(255,255,255,.07);--gap:12px;
 --vid:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--mbg:rgba(20,24,42,.97);
 --d-bg:rgba(24,27,44,.92);--d-tx:#f1f3fb;--d-mu:#8e96b3;--d-ac:#7dd3fc;--d-ln:rgba(255,255,255,.1)}
body{padding:12px 14px;gap:12px;background:#0b0d17;position:relative}
.luz{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 600px at 12% 0%,#1d2a5c 0,transparent 70%),radial-gradient(800px 600px at 100% 100%,#3b1d5c 0,transparent 70%),#0b0d17}
.luz i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(80px);opacity:.38;animation:deriva 28s ease-in-out infinite alternate}
.luz i:nth-child(1){background:#0ea5e9;left:-8vmax;top:-10vmax}.luz i:nth-child(2){background:#8b5cf6;right:-10vmax;top:20vh;animation-delay:-9s}.luz i:nth-child(3){background:#14b8a6;left:30vw;bottom:-22vmax;animation-delay:-18s}

.vd2,.top,.kp,.col>.pn,.cx-tab{background:var(--vid);border:1px solid var(--bd);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -20px rgba(0,0,0,.7)}

.top{flex:none;display:flex;align-items:center;gap:12px;min-width:0;border-radius:16px;padding:8px 10px}

.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#0b0d17;background:linear-gradient(135deg,#7dd3fc,#c4b5fd);flex:none}

.vivo:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;margin-right:5px}
.busca{display:flex;align-items:center;gap:8px;height:36px;border-radius:11px;background:rgba(0,0,0,.25);border:1px solid var(--ln);padding:0 12px;width:min(340px,30vw);color:var(--mu)}

[data-perf-ctl]{background:rgba(0,0,0,.25);border-color:var(--ln);color:var(--tx)}
.lk{display:flex;gap:6px}.lk a,.lk button{font-family:inherit;cursor:pointer;height:36px;display:grid;place-items:center;padding:0 13px;border-radius:11px;border:1px solid var(--ln);background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none;font-weight:600;font-size:12.5px;white-space:nowrap}.lk a:hover,.lk button:hover{background:rgba(255,255,255,.1)}
.kpis{flex:none}.kp{border-radius:16px;padding:10px 14px}
.kp1{background:linear-gradient(135deg,rgba(125,211,252,.22),rgba(196,181,253,.14))}.kp1 b{color:#fff}
.grade{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.col>.pn,.cx-tab{border-radius:18px;padding:12px 12px 10px}
.cx-tipos{flex:none}.cx-pag{flex:0 1 auto}.cx-cx{flex:0 1 auto}.cx-conv{flex:1 1 90px}
.cx-vend{flex:1.5 1 0}.cx-hr{flex:0 0 150px}.cx-prod{flex:1 1 0}
.cx-tab{min-height:0}.cx-tab .tabela{border-radius:12px;overflow:hidden;border:1px solid var(--ln2);background:rgba(0,0,0,.18)}
.lv:nth-child(even){background:rgba(255,255,255,.02)}
.br-b i,.vd-b i,.pd-b i{box-shadow:0 0 10px color-mix(in srgb,var(--c,var(--ac)) 60%,transparent)}
.hr-s{background:rgba(255,255,255,.05)}
#ov{background:rgba(5,6,12,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}#ov .det{border:1px solid var(--bd);border-radius:22px;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.tmMenu{border-color:var(--bd);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}

@media (max-width:1440px){[data-perf-ctl] .perfRot{display:none}}
@media (min-width:1600px){.grade{grid-template-columns:300px minmax(0,1fr) 380px}.cx-hr{flex-basis:190px}}
@media (max-width:1180px){.grade{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.cx-tab{grid-row:1/3}.esq{grid-column:2;grid-row:1}.dir{grid-column:2;grid-row:2}.cx-prod,.cx-conv{display:none}.busca{width:200px}#kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kp5,.kp6,.kp7{display:none}}
@media (max-width:980px){.lk .lkTxt{display:none}}
@media (max-width:820px){
 body{padding:10px 10px 0;gap:10px}
 .top{flex-wrap:wrap;gap:8px}.marca{width:100%}.busca{flex:1;width:auto}.seg{order:5;width:100%}.seg button{flex:1;padding:6px 4px}[data-perf-ctl]{display:none}
 .grade{display:flex;flex-direction:column;overflow:auto;gap:10px;padding-bottom:10px}.col{display:contents}
 .col>.pn,.cx-tab{flex:none}.cx-tab{flex:1;min-height:0}
 .abas{margin:0 -10px;background:rgba(14,16,28,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
 .cx-tab>h3 em{display:none}
 .kp{padding:7px 12px}.top{padding:8px}.lk a,.lk button{padding:0 10px;height:34px}.logo{width:32px;height:32px}
}
.tst{border:1px solid var(--bd);background:rgba(20,24,42,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
